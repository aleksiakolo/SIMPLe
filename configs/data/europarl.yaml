dataset:
  name: "Helsinki-NLP/europarl"
  language_pair: "en-es" 
  source: "en" 
  target: "es"  
  test_size: 0.1
  val_size: 0.15
  seed: 42
  subset_fraction: 0.01  # ~2M pairs in total, so 1% of each split is still ~15k training pairs

preprocessing:
  lowercase: false  # keep casing: pretrained models and references are cased
  remove_non_alphanumeric: false  # keep punctuation and accents (á, ñ, ¿, ...)
  remove_extra_whitespace: true

tokenization:
  model_name: ${model.params.name}
  input_prefix: ${oc.select:model.params.input_prefix,""}  # task prefix, only set for T5
  max_length: 128  # source tokens
  max_target_length: 128  # target tokens

output:
  dir: "/Users/aleksia/Desktop/europarl_data"
  save_format: "json"  # options: "json", "csv", or "parquet"
