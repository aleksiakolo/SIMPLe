dataset:
  name: "allenai/multi_lexsum"
  config_version: "v20220616"  # or "v20230518"
  source_field: "sources"  
  target_summary_length: "long"  # Options: "long", "short", "tiny"
  test_size: 0.1
  val_size: 0.15
  seed: 42
  subset_fraction: 1.0  # fraction of each split to keep (lower it to save compute)

preprocessing:
  lowercase: false  # keep casing: pretrained models and references are cased
  remove_non_alphanumeric: false  # keep punctuation and accents (á, ñ, ¿, ...)
  remove_extra_whitespace: true

tokenization:
  model_name: ${model.params.name}
  input_prefix: ${oc.select:model.params.input_prefix,""}  # task prefix, only set for T5
  # source tokens; documents are far longer, so inputs are truncated (Legal-BERT has 512 positions)
  max_length: 512
  max_target_length: 256  # summary tokens, should match the model's max_target_length

output:
  dir: "/Users/aleksia/Desktop/multi_lexsum_data"
  save_format: "json"  # options: "json", "csv", or "parquet"
