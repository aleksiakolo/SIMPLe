_target_: src.models.summarization.LegalBERT.initialize

params:
  name: "nlpaueb/legal-bert-base-uncased"
  task: "summarization"
  max_input_length: 512
  max_target_length: 256  # max new tokens generated during val/test
  num_beams: 4
  logging_frequency: 10
  logging: true

trainer:
  params:
    batch_size: 16
    learning_rate: 3e-5
    max_epochs: 5
    lr_step_size: 10
    lr_gamma: 0.1

cache_dir: ./tmp
