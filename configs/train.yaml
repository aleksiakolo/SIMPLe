# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - data: europarl
  - model: Null
  - logger: csv
  - callbacks: default
  - trainer: default
  - paths: default
  - hydra: default

# name determines output directory path
name: ""
# task_name determines log directory path
task_name: ""

# set False to skip model training
train: true

# evaluate on test set, using best model weights achieved during training
# lightning chooses best weights based on the metric specified in checkpoint callback
test: true

# provide checkpoint path to resume training
ckpt_path: null

# seed for random number generators in pytorch, numpy and python.random
seed: 42

# batch size and epochs come from the selected model config; override on the command line if needed
# (e.g. params.batch_size=4). Optimizer settings live in the model config under trainer.params.
params:
  batch_size: ${model.trainer.params.batch_size}
  num_epochs: ${model.trainer.params.max_epochs}
