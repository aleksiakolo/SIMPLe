_target_: src.models.translation.mBART.initialize

params:
  name: "facebook/mbart-large-50-many-to-many-mmt"
  task: "translation"
  src_lang: "en_XX"  # mBART-50 language codes, must match the data source/target
  tgt_lang: "es_XX"
  max_input_length: 512
  logging_frequency: 10
  logging: true

trainer:
  params:
    batch_size: 16
    learning_rate: 3e-5
    max_epochs: 5
    lr_step_size: 10
    lr_gamma: 0.1

cache_dir: ./tmp

metric:
  _target_: torch.nn.CrossEntropyLoss
